[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "projection-stratified-kde"
version = "0.1.0"
description = "Frozen projection-guided remainder stratification for Gaussian kernel sums"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2"]

[project.optional-dependencies]
analysis = ["pandas>=2,<3", "matplotlib>=3.7,<4", "scikit-learn>=1.3,<2"]

[tool.setuptools.packages.find]
where = ["src"]
